name: Godot checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Oldest Godot version the project supports (see project.godot features).
      GODOT_VERSION: 4.6.3
    steps:
      - uses: actions/checkout@v4

      - name: Check asset ledger and AI tagging
        run: python3 tools/check_asset_ledger.py

      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          ./godot --version

      - name: Import project
        run: ./godot --headless --import

      - name: Run flight smoke test
        # timeout guards against a script error leaving the test hanging.
        run: tools/run_godot_test.sh ./godot res://tests/smoke_test.gd 180

      - name: Run combat and mining smoke test
        run: tools/run_godot_test.sh ./godot res://tests/combat_test.gd 180

      - name: Run rift and menus smoke test
        run: tools/run_godot_test.sh ./godot res://tests/rift_test.gd 240

      - name: Run economy test
        run: tools/run_godot_test.sh ./godot res://tests/economy_test.gd 180
